# use non-login shell
set -g default-command "${SHELL}"

unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind r source-file ~/.tmux.conf \;  display-message "Config Reloaded!"
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind c
# Always append new windows after the last window.
bind c new-window -a -t '{end}' -c "#{pane_current_path}"

# use vim mode to move panel
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Killer
bind x kill-pane
bind X kill-window

# Lowercase uses tmux buffers; uppercase uses the X11 clipboard explicitly.
set -s set-clipboard off
bind v paste-buffer
bind P choose-buffer -Z
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Redirect xclip stdout so its background clipboard owner does not hold tmux's pipe open.
bind V run-shell "xclip -selection clipboard -o | tmux load-buffer - && tmux paste-buffer -t '#{pane_id}'"
bind Y run-shell "tmux save-buffer - | xclip -selection clipboard -i >/dev/null"
bind -T copy-mode-vi Y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i >/dev/null"

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g mouse on
set -g focus-events on


set -g status-bg colour235
set -g status-fg colour136

set -g bell-action none

setw -g mode-keys vi
#### COLOUR (Solarized 256)

# default statusbar colors
set-option -g status-style fg=colour136,bg=colour235 #yellow and base02

# default window title colors
set-window-option -g window-status-style fg=colour244,bg=default #base0 and default
#set-window-option -g window-status-style dim

# active window title colors
set-window-option -g window-status-current-style fg=colour166,bg=default #orange and default
#set-window-option -g window-status-current-style bright

# pane border
set-option -g pane-border-style fg=colour235 #base02
set-option -g pane-active-border-style fg=colour240 #base01

# message text
set-option -g message-style fg=colour166,bg=colour235 #orange and base02

# pane number display
set-option -g display-panes-active-colour colour33 #blue
set-option -g display-panes-colour colour166 #orange

# clock
set-window-option -g clock-mode-colour colour64 #green

# bell
set-window-option -g window-status-bell-style fg=colour235,bg=colour160 #base02, red

run-shell ~/.local/tmux-resurrent/resurrect.tmux
# set -g @resurrect-strategy-nvim 'session'
set-option -g history-limit 999999
